
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'Quilt Releases'
        url = 'https://maven.quiltmc.org/repository/release/'
        content {
            includeGroup 'org.quiltmc.parsers'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    modImplementation "maven.modrinth:melody:1.0.15-1.21.11-fabric"
    modImplementation "maven.modrinth:konkrete:1.9.18-1.21.11-fabric"
	modImplementation "maven.modrinth:fancymenu:3.9.9-1.21.11-fabric"
    modImplementation "maven.modrinth:modmenu:17.0.0-beta.1"
    implementation "net.objecthunter:exp4j:0.4.8"
    implementation project(":common")

    // Iris 1.10.7 explicitly targets Sodium 0.8.x, so these pins must stay aligned when the test matrix is updated.
    modImplementation "maven.modrinth:AANobbMI:UddlN6L4" // Sodium
    modImplementation "maven.modrinth:PtjYWJkn:yqY1efrC" // Sodium Extra
    modImplementation "maven.modrinth:gvQqBUqZ:Ow7wA0kG" // Lithium
    modImplementation "maven.modrinth:YL57xq9U:fDpuVzVr" // Iris
    // ImmediatelyFast 1.14.3 requires Loom 1.17 metadata; 1.14.2 is the newest build remappable by this branch's Loom 1.14.
    modImplementation "maven.modrinth:5ZwdcRci:QwkfUKSj" // ImmediatelyFast
    modImplementation "maven.modrinth:uXXizFIs:Ii0gP3D8" // FerriteCore
    modImplementation "maven.modrinth:1eAoo2KR:pHWDw3Vc" // YACL

    // Loom 1.14 removes nested-jar declarations while remapping these test mods, so their exact bundled libraries
    // must also be present on the development runtime classpath. Keep these pins synchronized with the jars above.
    runtimeOnly("net.lenni0451:Reflect:1.6.1") { transitive = false } // ImmediatelyFast
    runtimeOnly("org.antlr:antlr4-runtime:4.13.1") { transitive = false } // Iris
    runtimeOnly("io.github.douira:glsl-transformer:3.0.0-pre3") { transitive = false } // Iris
    runtimeOnly("org.anarres:jcpp:1.4.14") { transitive = false } // Iris
    runtimeOnly("com.twelvemonkeys.imageio:imageio-core:3.12.0") { transitive = false } // YACL
    runtimeOnly("com.twelvemonkeys.imageio:imageio-webp:3.12.0") { transitive = false } // YACL
    runtimeOnly("com.twelvemonkeys.imageio:imageio-metadata:3.12.0") { transitive = false } // YACL
    runtimeOnly("com.twelvemonkeys.common:common-lang:3.12.0") { transitive = false } // YACL
    runtimeOnly("com.twelvemonkeys.common:common-io:3.12.0") { transitive = false } // YACL
    runtimeOnly("com.twelvemonkeys.common:common-image:3.12.0") { transitive = false } // YACL
    runtimeOnly("org.quiltmc.parsers:json:0.2.1") { transitive = false } // YACL
    runtimeOnly("org.quiltmc.parsers:gson:0.2.1") { transitive = false } // YACL

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    // Allow builds when there are test sources but no matching tests.
    failOnNoDiscoveredTests = false
    workingDir(layout.buildDirectory.dir("test-working-directory"))
    doFirst {
        workingDir.mkdirs()
    }
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
