
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    compileOnly "com.github.Keksuccino:japng:0.5.3"
    compileOnly "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7"
    modImplementation "maven.modrinth:melody:1.0.4-1.20.1-1.20.4-fabric"
    modImplementation "maven.modrinth:konkrete:1.8.1-1.20.1-fabric"
    modImplementation "maven.modrinth:modmenu:7.2.2"
    modImplementation "maven.modrinth:fancymenu:3.9.9-1.20.1-fabric"
    implementation project(":common")

    modImplementation "maven.modrinth:AANobbMI:OihdIimA" // Sodium
    modImplementation "maven.modrinth:PtjYWJkn:I7ggF6B5" // Sodium Extra
    // Loom does not expose Sodium Extra's nested CaffeineConfig JAR on development runtime classpaths.
    modRuntimeOnly "net.caffeinemc:CaffeineConfig:1.3.0+1.17"
    modImplementation "maven.modrinth:gvQqBUqZ:iEcXOkz4" // Lithium
    modImplementation "maven.modrinth:YL57xq9U:s5eFLITc" // Iris
    modImplementation "maven.modrinth:5ZwdcRci:xXPjBbf0" // ImmediatelyFast
    runtimeOnly "net.lenni0451:Reflect:1.3.4" // Nested in ImmediatelyFast's production JAR.
    modImplementation "maven.modrinth:uXXizFIs:unerR5MN" // FerriteCore
    modImplementation "maven.modrinth:1eAoo2KR:yDSgD8Iz" // YACL
    // Loom also strips YACL's nested Quilt parser JARs from the development runtime classpath.
    modRuntimeOnly "org.quiltmc.parsers:gson:0.2.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir("test-working-directory").get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
